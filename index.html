<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Untuk Kamu ❤️</title>
<style>
  :root{
    --blush: #ffe3e9;
    --blush-deep: #ffc2d1;
    --rose: #ff5d7a;
    --rose-deep: #e63950;
    --cream: #fff7f8;
    --ink: #4a2b33;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;height:100%;
    font-family: 'Segoe UI', 'Trebuchet MS', sans-serif;
    background: radial-gradient(circle at 50% 20%, var(--cream), var(--blush) 60%, var(--blush-deep) 100%);
    overflow:hidden;
    color:var(--ink);
  }
  .stage{
    position:relative;
    width:100%;height:100vh;
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    text-align:center;
  }

  /* floating background hearts */
  .bg-heart{
    position:absolute;
    bottom:-40px;
    color:var(--rose);
    opacity:.55;
    font-size:22px;
    animation: floatUp linear infinite;
    user-select:none;
    pointer-events:none;
  }
  @keyframes floatUp{
    0%{transform:translateY(0) rotate(0deg);opacity:0;}
    10%{opacity:.6;}
    90%{opacity:.5;}
    100%{transform:translateY(-110vh) rotate(25deg);opacity:0;}
  }

  h1{
    font-size: clamp(28px, 5vw, 46px);
    color: var(--rose-deep);
    margin: 6px 0 2px;
    letter-spacing: 1px;
    text-shadow: 0 2px 0 #fff;
    animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{transform:scale(1);}
    50%{transform:scale(1.06);}
  }
  .subtitle{
    font-size: 16px;
    color:#a5525f;
    margin-bottom: 18px;
  }

  /* character */
  .character{
    position:relative;
    width:120px;height:150px;
    margin-bottom: 6px;
    animation: bob 2.2s ease-in-out infinite;
  }
  @keyframes bob{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-8px);}
  }
  .head{
    width:70px;height:70px;
    background:#fff;
    border:3px solid var(--ink);
    border-radius:50%;
    position:absolute;
    top:0;left:25px;
  }
  .eye{
    width:5px;height:8px;
    background:var(--ink);
    border-radius:50%;
    position:absolute;
    top:30px;
  }
  .eye.left{left:20px;}
  .eye.right{right:20px;}
  .blush{
    width:10px;height:6px;
    background:#ffb3c1;
    border-radius:50%;
    position:absolute;
    top:42px;
  }
  .blush.left{left:12px;}
  .blush.right{right:12px;}
  .smile{
    width:14px;height:7px;
    border-bottom:3px solid var(--ink);
    border-radius:0 0 12px 12px;
    position:absolute;
    top:44px;left:28px;
  }
  .body{
    width:56px;height:70px;
    background:#fff;
    border:3px solid var(--ink);
    border-radius:26px 26px 30px 30px;
    position:absolute;
    top:62px;left:32px;
  }
  .arm{
    width:38px;height:10px;
    background:#fff;
    border:3px solid var(--ink);
    border-radius:10px;
    position:absolute;
    top:78px;
    transform-origin: left center;
  }
  .arm.right{
    right:8px;
    animation: wave 1.1s ease-in-out infinite;
    transform-origin: left center;
  }
  @keyframes wave{
    0%,100%{transform: rotate(0deg);}
    50%{transform: rotate(-25deg);}
  }

  .biu{
    position:absolute;
    top:52px; right:-46px;
    font-family: 'Comic Sans MS', 'Trebuchet MS', cursive;
    font-weight:bold;
    color:var(--rose-deep);
    font-size:14px;
    opacity:0;
  }

  /* little heart shot from hand */
  .shot-heart{
    position:absolute;
    left:50%;
    font-size:20px;
    opacity:0;
    pointer-events:none;
  }

  .message{
    font-size: clamp(22px, 4vw, 34px);
    font-family: Georgia, 'Times New Roman', serif;
    color: var(--rose-deep);
    margin-top: 8px;
    min-height: 44px;
  }

  button{
    margin-top: 22px;
    padding: 12px 26px;
    font-size: 16px;
    border:none;
    border-radius: 999px;
    background: var(--rose);
    color:#fff;
    cursor:pointer;
    box-shadow: 0 6px 14px rgba(230,57,80,.35);
    transition: transform .15s ease, background .2s ease;
  }
  button:hover{
    background: var(--rose-deep);
    transform: translateY(-2px) scale(1.03);
  }
  button:active{
    transform: translateY(0) scale(.97);
  }

  /* burst hearts on click */
  .burst-heart{
    position: fixed;
    font-size: 22px;
    color: var(--rose);
    pointer-events:none;
    z-index: 5;
    animation: burst 1.4s ease-out forwards;
  }
  @keyframes burst{
    0%{transform: translate(0,0) scale(0.6); opacity:1;}
    100%{transform: translate(var(--dx), var(--dy)) scale(1.1); opacity:0;}
  }
</style>
</head>
<body>

<div class="stage" id="stage">
  <h1>Hai Sayang 💕</h1>
  <div class="subtitle">ada satu pesan kecil buat kamu...</div>

  <div class="character">
    <div class="head">
      <div class="eye left"></div>
      <div class="eye right"></div>
      <div class="blush left"></div>
      <div class="blush right"></div>
      <div class="smile"></div>
    </div>
    <div class="body"></div>
    <div class="arm right"></div>
    <div class="biu" id="biu">biu~</div>
  </div>

  <div class="message" id="msg">I Love You ❤️</div>

  <button id="sendBtn">Kirim Cinta 💌</button>
</div>

<script>
  const stage = document.getElementById('stage');

  // ambient floating hearts in background
  const bgHeartChars = ['❤','💕','💗','💞'];
  function spawnBgHeart(){
    const h = document.createElement('div');
    h.className = 'bg-heart';
    h.textContent = bgHeartChars[Math.floor(Math.random()*bgHeartChars.length)];
    h.style.left = Math.random()*100 + 'vw';
    h.style.fontSize = (14 + Math.random()*18) + 'px';
    const duration = 6 + Math.random()*6;
    h.style.animationDuration = duration + 's';
    stage.appendChild(h);
    setTimeout(()=>h.remove(), duration*1000);
  }
  setInterval(spawnBgHeart, 450);
  for(let i=0;i<8;i++) setTimeout(spawnBgHeart, i*200);

  // messages that cycle
  const messages = [
    "I Love You ❤️",
    "Kamu Cantik Banget 🥰",
    "Semangat Ya Hari Ini 💪",
    "Makasih Udah Jadi Kamu 🌸",
    "Aku Sayang Kamu Selalu 💖"
  ];
  let idx = 0;
  const msgEl = document.getElementById('msg');
  setInterval(()=>{
    idx = (idx+1) % messages.length;
    msgEl.style.opacity = 0;
    setTimeout(()=>{
      msgEl.textContent = messages[idx];
      msgEl.style.transition = 'opacity .4s ease';
      msgEl.style.opacity = 1;
    },350);
  }, 2600);

  // click button -> heart burst explosion
  document.getElementById('sendBtn').addEventListener('click', (e)=>{
    const rect = e.target.getBoundingClientRect();
    const cx = rect.left + rect.width/2;
    const cy = rect.top;
    const hearts = ['❤','💕','💖','💗','💘'];
    for(let i=0;i<24;i++){
      const h = document.createElement('div');
      h.className = 'burst-heart';
      h.textContent = hearts[Math.floor(Math.random()*hearts.length)];
      h.style.left = cx + 'px';
      h.style.top = cy + 'px';
      const angle = Math.random()*Math.PI*2;
      const dist = 80 + Math.random()*180;
      h.style.setProperty('--dx', Math.cos(angle)*dist + 'px');
      h.style.setProperty('--dy', (Math.sin(angle)*dist - 100) + 'px');
      document.body.appendChild(h);
      setTimeout(()=>h.remove(), 1500);
    }
  });
</script>

</body>
</html>
